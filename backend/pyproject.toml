[project]
name = "senda-api"
version = "1.0.0"
description = "API de demostración para permisos de carpetas en obra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "sqlalchemy>=2.0.36",
    "pydantic-settings>=2.6.0",
    "python-multipart>=0.0.12",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.2.0",
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
